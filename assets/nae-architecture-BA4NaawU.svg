  </text>

  <!-- Play Store Badge Pill in SVG -->
  <rect x="920" y="47" width="210" height="38" rx="19" fill="#064E3B" stroke="#10B981" stroke-width="1.2"/>
  <circle cx="942" cy="66" r="5" fill="#34D399"/>
  <text x="956" y="71" fill="#ECFDF5" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700">
