  <!-- Card 2A: Shared Design System nae_ui -->
  <rect x="430" y="152" width="340" height="145" rx="16" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.7"/>
  <text x="452" y="184" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="15.5" font-weight="700">
