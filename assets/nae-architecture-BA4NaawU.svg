  <!-- Card 3C: E2E QA & Release Engineering -->
  <rect x="832" y="480" width="320" height="145" rx="16" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.7"/>
  <text x="854" y="512" fill="#FBBF24" font-family="system-ui, -apple-system, sans-serif" font-size="15.5" font-weight="700">
