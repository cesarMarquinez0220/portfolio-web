  <rect x="68" y="330" width="280" height="30" rx="8" fill="#0F172A" stroke="#1E293B"/>
  <text x="80" y="349" fill="#38BDF8" font-family="monospace" font-size="11.5" font-weight="600">
    id: app.nae.com (Google Play Store)
  </text>

  <!-- Card 1B: Web Admin SPA -->
  <rect x="48" y="400" width="320" height="225" rx="16" fill="url(#cardGrad)" stroke="#818CF8" stroke-width="1.5" stroke-opacity="0.7"/>
  <rect x="48" y="400" width="320" height="6" rx="3" fill="url(#purpleAccent)"/>
  <rect x="68" y="422" width="124" height="24" rx="6" fill="#4F46E5" fill-opacity="0.25"/>
